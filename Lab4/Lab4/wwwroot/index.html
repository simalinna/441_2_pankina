<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача коммивояжера</title>
    <link rel="stylesheet" href="./style.css">
</head>

<!-- Пользовательский интерфейс позволяет задать параметры задачи.
Для задачи коммивояжера отображается матрица расстояний между городами.
Также пользовательский интерфейс предоставляет кнопки для запуска и остановки процесса оптимизации.
В ходе поиска решения отображается номер итерации, лучший экземпляр и его метрика. -->

<body>

    <main>

        <div class="container">

            <form class="child" action="">
                <label class="item" for="citiesCounter">Введите количество городов:</label>
                <input class="item" type="text" value="5" name="citiesCounter" id="citiesCounter">
                <label class="item" for="populationSize">Введите размер популяции:</label>
                <input class="item" type="text" value="70" name="populationSize" id="populationSize">
                <button class="item" id="createPopulationButton" type="button" onclick="createPopulation()" disabled>Создать начальную популяцию</button>
            </form>

            <div class="child" id="citiesTableContainer">
                <table id="citiesTable">
                </table>
            </div>


            <form class="child">
                <label class="item" id="generationsCounter">Номер поколения: </label>
                <label class="item" id="bestDistance">Лучшая длина маршрута: </label>
                <label class="item" id="meanDistance">Средняя длина маршрута: </label>
            </form>

            <form class="child">
                <button class="item" id="startEvolutionButton" type="button" onclick="startEvolution()" disabled>Запустить эволюцию</button>
                <button class="item" id="stopEvolutionButton" type="button" onclick="stopEvolution()" disabled>Остановить эволюцию</button>
                <button class="item" id="finishExperimentButton" type="button" onclick="finishExperiment()" disabled>Завершить эксперимент</button>
            </form>

            <div class="child" id="bestRouteContainer">
                <label class="item" id="bestRoute">Лучший маршрут: </label>
                <table id="bestRouteTable">
                </table>
            </div>

        </div>

    </main>

    <script>

        var population = null;

        var evolutionFlag = false;

        const createPopulationButton = document.getElementById('createPopulationButton');
        const startEvolutionButton = document.getElementById('startEvolutionButton');
        const stopEvolutionButton = document.getElementById('stopEvolutionButton');
        const finishExperimentButton = document.getElementById('finishExperimentButton');

        createPopulationButton.disabled = false;


        async function createPopulation()
        {

            var citiesCount = document.getElementById('citiesCounter').value;
            var populationSize = document.getElementById('populationSize').value;

            const response = await fetch(`/api/solver/initial?citiesCount=${ citiesCount }&populationSize=${ populationSize }`, {
                method: "GET",
                headers: { "Accept": "application/json;charset=utf-8" },

            });

            if (response.ok === true) {

                population = await response.json();

                const citiesTableContainer = document.getElementById('citiesTableContainer');

                const citiesTable = document.getElementById('citiesTable');
                citiesTable.innerHTML = "";


                const headerRow = document.createElement('tr');
                headerRow.appendChild(document.createElement('th')); 

                for (let i = 0; i < population.citiesCount; i++) {
                    const th = document.createElement('th');
                    th.textContent = `Город ${i + 1}`;
                    headerRow.appendChild(th);
                }
                citiesTable.appendChild(headerRow);

                for (let i = 0; i < population.citiesCount; i++) {
                    const tableRow = document.createElement('tr');
                    const rowHeader = document.createElement('th');
                    rowHeader.textContent = `Город ${i + 1}`;
                    tableRow.appendChild(rowHeader);

                    for (const cell of population.distances[i]) {
                        const td = document.createElement('td');
                        td.textContent = cell;
                        tableRow.appendChild(td);
                    }
                    citiesTable.appendChild(tableRow);
                }

                citiesTableContainer.appendChild(citiesTable);


                const bestRouteContainer = document.getElementById('bestRouteContainer');

                const bestRouteTable = document.getElementById('bestRouteTable');
                bestRouteTable.innerHTML = "";

                const headerRow1 = document.createElement('tr');

                const th1 = document.createElement('th');
                th1.textContent = `Порядок обхода городов`;
                headerRow1.appendChild(th1);

                for (let i = 0; i < population.citiesCount; i++) {
                    const th1 = document.createElement('th');
                    th1.textContent = `Город ${population.bestRoute[i]}`;
                    headerRow1.appendChild(th1);
                }
                bestRouteTable.appendChild(headerRow1);
                bestRouteContainer.appendChild(bestRouteTable);


                const generationsCounter = document.getElementById('generationsCounter');
                generationsCounter.innerHTML = "Номер поколения: " + population.generationsCounter;

                const bestDistance = document.getElementById('bestDistance');
                bestDistance.innerHTML = "Лучшая длина маршрута: " + population.bestDistance;

                const meanDistance = document.getElementById('meanDistance');
                meanDistance.innerHTML = "Средняя длина маршрута: " + population.meanDistance;

                createPopulationButton.disabled = true;
                startEvolutionButton.disabled = false;
                stopEvolutionButton.disabled = true;
                finishExperimentButton.disabled = false;

            }
            else
            {
                alert("HTTP error: " + response.status);
            }

        }


        async function startEvolution()
        {
            evolutionFlag = true;
            createPopulationButton.disabled = true;
            startEvolutionButton.disabled = true;
            stopEvolutionButton.disabled = false;
            finishExperimentButton.disabled = true;

            while (true)
            {
                if (!evolutionFlag)
                {
                    break;
                }

                const response = await fetch(`/api/solver/next`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json;charset=utf-8" },
                    body: JSON.stringify(population)
                });

                if (response.ok === true) {

                    population = await response.json();

                    const bestRouteContainer = document.getElementById('bestRouteContainer');

                    const bestRouteTable = document.getElementById('bestRouteTable');
                    bestRouteTable.innerHTML = "";

                    const headerRow1 = document.createElement('tr');

                    const th1 = document.createElement('th');
                    th1.textContent = `Порядок обхода городов`;
                    headerRow1.appendChild(th1);

                    for (let i = 0; i < population.citiesCount; i++) {
                        const th1 = document.createElement('th');
                        th1.textContent = `Город ${population.bestRoute[i]}`;
                        headerRow1.appendChild(th1);
                    }
                    bestRouteTable.appendChild(headerRow1);
                    bestRouteContainer.appendChild(bestRouteTable);

                    const generationsCounter = document.getElementById('generationsCounter');
                    generationsCounter.innerHTML = "Номер поколения: " + population.generationsCounter;

                    const bestDistance = document.getElementById('bestDistance');
                    bestDistance.innerHTML = "Лучшая длина маршрута: " + population.bestDistance;

                    const meanDistance = document.getElementById('meanDistance');
                    meanDistance.innerHTML = "Средняя длина маршрута: " + population.meanDistance;

                    await new Promise(r => setTimeout(r, 300));
                }
                else {
                    alert("ERROR")
                }
            }

        }


        function stopEvolution()
        {
            evolutionFlag = false;
            stopEvolutionButton.disabled = true;
            createPopulationButton.disabled = true;
            startEvolutionButton.disabled = false;
            finishExperimentButton.disabled = false;
        }


        function finishExperiment()
        {
            population = null;
            finishExperimentButton.disabled = true;
            startEvolutionButton.disabled = true;
            stopEvolutionButton.disabled = true;
            createPopulationButton.disabled = false;
            bestRouteTable.innerHTML = "";
            citiesTable.innerHTML = "";
        }


    </script>


</body>

</html>
